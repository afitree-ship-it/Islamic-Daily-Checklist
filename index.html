
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DeenTracker</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DeenTracker">
    <meta name="theme-color" content="#022c22">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@100;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Anuphan', sans-serif;
            background-color: #f8fafc;
            touch-action: manipulation; /* ลบ 300ms delay */
            -webkit-tap-highlight-color: transparent; /* ลบเงาสีฟ้าตอนกดบน iOS */
        }
        #root { min-height: 100vh; }
        
        /* ป้องกันการเลือกข้อความขณะกดปุ่มเช็คลิสต์รัวๆ */
        .no-select {
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* เพิ่มประสิทธิภาพการ scroll */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* เอฟเฟคคะแนนลอยขึ้นแบบละมุน */
        @keyframes floatUpFadeOut {
            0% {
                opacity: 0;
                transform: translateY(15px) scale(0.7);
            }
            15% {
                opacity: 1;
                transform: translateY(-5px) scale(1.15);
            }
            80% {
                opacity: 0.9;
            }
            100% {
                opacity: 0;
                transform: translateY(-55px) scale(0.85);
            }
        }

        .animate-float-score {
            animation: floatUpFadeOut 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            pointer-events: none;
            user-select: none;
        }

        /* เอฟเฟคโลโก้หายใจ (Breathing Logo Effect) */
        @keyframes logoBreath {
            0%, 100% {
                transform: scale(1) translateY(0);
                filter: drop-shadow(0 0 12px rgba(52, 211, 153, 0.4));
            }
            50% {
                transform: scale(1.07) translateY(-3px);
                filter: drop-shadow(0 0 28px rgba(52, 211, 153, 0.85));
            }
        }

        @keyframes auraPulse {
            0%, 100% {
                transform: scale(0.92);
                opacity: 0.25;
            }
            50% {
                transform: scale(1.22);
                opacity: 0.65;
            }
        }

        @keyframes rotateSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes rotateSlowReverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        .animate-logo-breath {
            animation: logoBreath 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        .animate-aura-pulse {
            animation: auraPulse 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        .animate-rotate-slow {
            animation: rotateSlow 24s linear infinite;
        }

        .animate-rotate-slow-reverse {
            animation: rotateSlowReverse 18s linear infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
